<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Reproplast RH high-level architecture</title>
  <desc id="desc">Public and authenticated web interfaces connect through an API layer to a PostgreSQL database and operational services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faf1"/>
      <stop offset="1" stop-color="#edf5e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#33511d" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <path d="M0 98H1200M0 510H1200" stroke="#79b43c" stroke-opacity=".16"/>
  <text x="68" y="74" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#315d16" letter-spacing="3">REPROPLAST RH · HIGH-LEVEL PLATFORM VIEW</text>

  <g filter="url(#shadow)">
    <rect x="70" y="172" width="270" height="254" rx="20" fill="#fff"/>
    <rect x="465" y="172" width="270" height="254" rx="20" fill="#315d16"/>
    <rect x="860" y="172" width="270" height="254" rx="20" fill="#fff"/>
  </g>

  <text x="105" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#315d16" letter-spacing="2">WEB EXPERIENCE</text>
  <text x="105" y="270" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2d19">React client</text>
  <text x="105" y="310" font-family="Arial, sans-serif" font-size="18" fill="#405238">Public site &amp; recruitment</text>
  <text x="105" y="342" font-family="Arial, sans-serif" font-size="18" fill="#405238">Authenticated HR workspace</text>
  <text x="105" y="374" font-family="Arial, sans-serif" font-size="18" fill="#405238">Role-aware workflows</text>

  <text x="500" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c6ef9c" letter-spacing="2">APPLICATION LAYER</text>
  <text x="500" y="270" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Express API</text>
  <text x="500" y="310" font-family="Arial, sans-serif" font-size="18" fill="#e5f4d7">Authentication &amp; authorization</text>
  <text x="500" y="342" font-family="Arial, sans-serif" font-size="18" fill="#e5f4d7">Business workflows &amp; reporting</text>
  <text x="500" y="374" font-family="Arial, sans-serif" font-size="18" fill="#e5f4d7">Email &amp; document services</text>

  <text x="895" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#315d16" letter-spacing="2">DATA &amp; OPERATIONS</text>
  <text x="895" y="270" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2d19">PostgreSQL</text>
  <text x="895" y="310" font-family="Arial, sans-serif" font-size="18" fill="#405238">HR and payroll domains</text>
  <text x="895" y="342" font-family="Arial, sans-serif" font-size="18" fill="#405238">Prisma data access</text>
  <text x="895" y="374" font-family="Arial, sans-serif" font-size="18" fill="#405238">Exports &amp; notifications</text>

  <path d="M342 299H450" stroke="#79b43c" stroke-width="7" stroke-linecap="round"/>
  <path d="M450 299l-17-12v24z" fill="#79b43c"/>
  <path d="M737 299H845" stroke="#79b43c" stroke-width="7" stroke-linecap="round"/>
  <path d="M845 299l-17-12v24z" fill="#79b43c"/>
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="16" fill="#52684a">Documentation-only representation · No source code, routes, schemas, or operational data included</text>
